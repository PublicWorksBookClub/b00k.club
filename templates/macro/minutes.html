{#-
  Bits shared by the minutes templates.
-#}

{#- One <option> for a work, carrying everything the minutes file needs in order to
    name it: the slug for the burndown key, the short name reminder anchors are
    built from, and the markdown link as it gets written into the bullet.

    It also carries what last week left of the work, so the form can work out this
    week's burndown row whichever work the scribe picks — the arithmetic runs
    against the chosen option, not against the one Zola guessed. Only the previous
    meeting counts: `starting` means "what was left when we sat down", so a work
    that went untracked last week has no run to continue and wants its total
    stating afresh.

    Where the conspectus records how long the work is, that comes too. It saves the
    units and the total being typed, and — for a work whose numbering starts again
    at every part — it is the only way the distance between two spots can be worked
    out at all, since 930 of one book to 430 of the next doesn't subtract.

    `shaped` and `parted` are lists of slugs rather than tests on the page, because
    Tera reports a key that a page never set as though it were present and true. -#}
{% macro work_option(w, selected, last_burndown, shaped, parted) %}
{%- set t = w.taxonomies.titles | first -%}
<option value="{{ w.slug }}" data-title="{{ t }}" data-short="{{ w.slug | split(pat='-') | last }}" data-md="[_{{ t }}_](/works/{{ w.slug }}/)"
  {%- if w.slug in last_burndown %} data-remaining="{{ last_burndown[w.slug].ending }}" data-units="{{ last_burndown[w.slug].units }}"{% endif %}
  {%- if w.slug in shaped %} data-length-units="{{ w.extra.length.units }}" data-origin="{{ w.extra.length.origin }}"
    {%- if w.slug in parted %} data-parts="{{ w.extra.length.parts | json_encode }}"
    {%- else %} data-total="{{ w.extra.length.total }}"{% endif %}
  {%- endif %}
  {%- if w.slug == selected %} selected{% endif %}>{{ w.taxonomies.authors | first }} — {{ t }}</option>
{%- endmacro work_option %}
