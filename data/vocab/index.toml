# indicates references to people, places, terms, etc... (from primary or secondary sources)
#
# Keys are the taxonomy term verbatim — taxonomy_single.html looks each one up as
# toml[term.name], so a key that does not match the term exactly renders nothing.
#
# `synonyms` lists attested variants first (the spelling the club's own translation
# prints — Butler's Ulysses, Crawley's Lacedaemon), then close spelling variants and
# Greek originals. Sourced from Wikipedia redirects, Wikidata aliases and Wikidata
# P460 counterparts, then grep-verified against the cached source texts.
description = "references to people, places, and things"
