<!doctype html>
<!-- `loading` is removed once the map is interactive; it is the readiness hook
     the export's browser tests wait on. -->
<html lang="en" class="loading">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Map — Public Works Book Club</title>
    <meta name="description" content="An interactive map from the Public Works Book Club." />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="/maps/viewer/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/maps/viewer/viewer.css" />

    <!-- Full-window rules for this page only; viewer.css keeps clear of html/body
         so it stays safe to load on a content page for the inline embed. -->
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        overflow: hidden;
        background: rgb(70 110 171);
      }
    </style>
  </head>

  <body class="mapview mapview--page">
    <div class="mapview__frame">
      <div class="mapview__map" role="application" aria-label="Interactive map"></div>

      <header class="mapview__chrome">
        <div class="mapview__titles">
          <h1 class="mapview__title">Loading map…</h1>
          <p class="mapview__subtitle"></p>
        </div>

        <div class="mapview__tools">
          <div class="mapview__search" role="search">
            <label class="visually-hidden" for="mapview-search-input">Search places</label>
            <input
              id="mapview-search-input"
              class="mapview__search-input"
              type="search"
              placeholder="Search places, peoples, markers…"
              autocomplete="off"
              spellcheck="false"
              aria-controls="mapview-search-results"
              aria-expanded="false"
            />
            <ul id="mapview-search-results" class="mapview__results" role="listbox" aria-label="Search results" hidden></ul>
          </div>

          <button class="mapview__button mapview__layers-toggle" type="button" aria-expanded="false">Layers</button>
          <a class="mapview__button mapview__edit" href="/maps/interactive/" title="Open this map in the full editor">Edit</a>
        </div>
      </header>

      <div class="mapview__layers" hidden>
        <fieldset>
          <legend>Show on the map</legend>
          <label><input type="checkbox" data-layer="routes" checked /> The voyage</label>
          <label><input type="checkbox" data-layer="markers" checked /> Markers</label>
          <label><input type="checkbox" data-layer="icons" checked /> Settlements</label>
          <label><input type="checkbox" data-layer="labels" checked /> Labels</label>
        </fieldset>
      </div>

      <aside class="mapview__legend" hidden>
        <button class="mapview__legend-toggle" type="button" aria-expanded="true">
          <span class="mapview__legend-title">Legend</span>
        </button>
        <ul class="mapview__legend-body"></ul>
      </aside>

      <noscript>
        <div class="mapview__fallback">
          This map needs JavaScript to pan and zoom. You can still open the
          <a href="/maps/interactive/">full map editor</a>, which needs JavaScript too — sorry.
        </div>
      </noscript>

      <div class="mapview__status" role="status" aria-live="polite">Loading map…</div>
    </div>

    <script src="/maps/viewer/vendor/leaflet/leaflet.js"></script>
    <script type="module">
      import { createViewer } from '/maps/viewer/viewer.js'
      createViewer({ root: document, standalone: true })
    </script>
  </body>
</html>
